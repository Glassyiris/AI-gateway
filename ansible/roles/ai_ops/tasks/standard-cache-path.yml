---
- name: Require exactly one scoped operation and Docker Compose
  ansible.builtin.assert:
    that:
      - ansible_run_tags | intersect(['deploy-standard-cache-path', 'restart-openai-api-cache-keeper', 'rollback-standard-cache-path']) | length == 1
      - ai_ops_compose_cmd == 'docker compose'
      - ai_ops_mode in ['plan', 'apply']
      - not ansible_check_mode
    fail_msg: Select one scoped cache tag with Docker Compose; use ai_ops_mode=plan, not --check.

- name: Select scoped operation
  ansible.builtin.set_fact:
    _cache_operation: "{{ 'deploy' if 'deploy-standard-cache-path' in ansible_run_tags else ('restart' if 'restart-openai-api-cache-keeper' in ansible_run_tags else 'rollback') }}"
    _cache_payload: {}

- name: Read the adopted private candidate without stripping bytes
  ansible.builtin.set_fact:
    _cache_payload: "{{ _cache_payload | combine({item: lookup('ansible.builtin.file', ai_ops_config_dir + '/' + item, rstrip=False, lstrip=False) | b64encode}) }}"
  loop: [compose.yaml, apisix/apisix.yaml, apisix-models/apisix.yaml, apisix-models/config.yaml, apisix-models/routing_selector.lua, compose.override.yaml, .env]
  when: _cache_operation == 'deploy'
  no_log: true

# Source is transported as an argument, not installed/staged in the deploy root.
# Plan reads files and Docker metadata only; Ansible's own transport temp files
# are not deployment state.
- name: Execute the guarded cache transaction
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../scripts/ops/standard-cache-path.py') }}"
      - "{{ _cache_operation }}"
      - --mode
      - "{{ ai_ops_mode }}"
      - --root
      - "{{ ai_ops_deploy_root }}"
      - --project
      - "{{ ai_ops_compose_project }}"
      - --approved-plan
      - "{{ ai_ops_openai_api_cache_keeper_approved_plan }}"
      - --snapshot
      - "{{ ai_ops_openai_api_cache_keeper_snapshot }}"
      - --retries
      - "{{ ai_ops_openai_api_cache_keeper_verify_retries | string }}"
      - --delay
      - "{{ ai_ops_openai_api_cache_keeper_verify_delay_seconds | string }}"
      - --min-memory
      - "{{ ai_ops_min_mem_mb | string }}"
      - --min-disk
      - "{{ ai_ops_min_disk_mb | string }}"
    stdin: "{{ _cache_payload | to_json }}"
  register: _cache_run
  changed_when: false
  failed_when: false
  no_log: true

- name: Reject an unverified cache operation
  ansible.builtin.fail:
    msg: "{{ (_cache_run.stderr | from_json).error if (_cache_run.stderr | trim).startswith('{') else 'Scoped operation failed before a sanitized receipt; inspect the host privately.' }}"
  when: _cache_run.rc != 0

- name: Show sanitized cache plan or verified receipt
  ansible.builtin.debug:
    msg: "{{ _cache_run.stdout | from_json }}"
  changed_when: (_cache_run.stdout | from_json).changed
