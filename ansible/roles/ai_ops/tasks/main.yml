---
# Defaults remain play-wide. Scoped cache operations share one transaction.
- name: Run the selected standard-cache operation
  ansible.builtin.import_tasks: standard-cache-path.yml
  when: ansible_run_tags | intersect(['deploy-standard-cache-path', 'restart-openai-api-cache-keeper', 'rollback-standard-cache-path']) | length > 0
  tags: [deploy-standard-cache-path, restart-openai-api-cache-keeper, rollback-standard-cache-path]
